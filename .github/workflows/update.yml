name: Mise à jour des données

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: pip install -r requirements.txt

      - name: Télécharger les nouvelles données
        run: python fetch_data.py

      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/uemoa.csv
          git diff --staged --quiet || git commit -m "Mise à jour automatique des données"
          git push
